<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 03</title>
    <script src="./q03.js" defer></script>
</head>
<body>
    <h1>Questão 03</h1>
    <p>
    Escreva um programa que leia um valor em metros e converta-o para centímetros.
    </p>

    <form id="formDados">
        <label for="valorMetros">Valor em metros:</label>
        <input type="number" step=0.01 min="0.01" id="valorMetros" placeholder="Digite o valor em metros aqui...">
    
        <button type="submit">Converter para centímetros</button>
    </form>

    <p id="resultado"></p>
    
</body>
</html>
