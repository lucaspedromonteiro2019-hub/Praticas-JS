<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 05</title>
    <script src="./q05.js" defer></script>
</head>
<body>
    <h1>Questão 05</h1>
    <p>
        Escreva um programa que calcule o salário de um professor baseado no valor da hora-aula e da quantidade de
     horas trabalhadas, obtidas a partir do teclado.
    </p>  

    <form id="formDados">
        <label for="valorHoraAula">Valor da hora-aula:</label>
        <input type="number" step=0.01 min="0.01" id="valorHoraAula" placeholder="Digite o valor da hora-aula aqui...">

        <label for="quantidadeHoras">Quantidade de horas trabalhadas:</label>
        <input type="number" step=0.01 min="0.01" id="quantidadeHoras" placeholder="Digite a quantidade de horas trabalhadas aqui...">
      
        <button type="submit">Calcular o salário</button>
    </form>

    <p id="resultado"></p>
</body>
</html>
