<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 02</title>
    <script src="./q02.js" defer></script>
</head>
<body>
    <h1>Questão 02</h1>
    <p>
      Escreva um programa que leia um valor inteiro e calcule o seu quadrado.
    </p>

    <form id="formDados">
      <label for="valorInteiro">Valor inteiro:</label>
      <input type="number" step=1 min="1" id="valorInteiro" placeholder="Digite o valor inteiro aqui...">

      <button type="submit">Calcular o quadrado</button>
    </form>

    <p id="resultado"></p>
    
</body>
</html>
