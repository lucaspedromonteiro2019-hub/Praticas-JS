<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 04</title>
    <script src="./q04.js" defer></script>
</head>
<body>
    <h1>Questão 04</h1>
    <p>
    Escreva um programa que calcule o perímetro (circunferência) de um círculo a partir do valor do raio.
    </p>

    <form id="formDados">
        <label for="valorRaio">Valor do raio:</label>
        <input type="number" step=0.01 min="0.01" id="valorRaio" placeholder="Digite o valor do raio aqui...">
     
        <button type="submit">Calcular o perímetro</button>
    </form>

    <p id="resultado"></p>

</body>
</html>
